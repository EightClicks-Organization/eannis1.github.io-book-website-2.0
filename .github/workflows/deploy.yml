name: Deploy to Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: book-site/package-lock.json

      - name: Build React app
        working-directory: book-site
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir _site
          rsync -av \
            --exclude='.git' --exclude='.github' \
            --exclude='book-site' --exclude='_site' \
            ./ _site/
          mkdir -p _site/app
          cp -r book-site/dist/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
